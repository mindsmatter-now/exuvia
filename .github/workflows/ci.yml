name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One result per Node version; "cancelled" would look like a measurement.
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npx prettier --check src/
      - run: npx tsc
      - run: node --test dist/*.test.js
      # Kiro, 11 Oct: a glob that matches nothing fails silently. Every
      # src/**/*.test.ts must show up as a dist/*.test.js, or this goes red.
      - name: All test files compiled and run
        run: |
          src=$(find src -name '*.test.ts' | wc -l)
          dist=$(ls dist/*.test.js | wc -l)
          echo "test files: src=$src dist=$dist"
          [ "$src" -gt 0 ] && [ "$src" -eq "$dist" ]
      # dms-server has its own package and was never run by CI (Kiro, 11 Oct).
      - name: dms-server tests
        working-directory: dms-server
        run: |
          npm ci
          npx tsc
          src=$(find src -name '*.test.ts' | wc -l)
          dist=$(ls dist/*.test.js | wc -l)
          echo "dms-server test files: src=$src dist=$dist"
          [ "$src" -gt 0 ] && [ "$src" -eq "$dist" ]
          node --test dist/*.test.js

  security:
    runs-on: ubuntu-latest
    # Known red until #11 is closed: visible, but does not block the test jobs.
    # Merge criterion meanwhile: all test jobs green, security red only for #11.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
